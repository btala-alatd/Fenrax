services:
  - type: web
    name: fenrax
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: render-com
      - key: NITRO_HOST
        value: "0.0.0.0"
      - key: HOST
        value: "0.0.0.0"
      - key: VITE_AUTH_ENABLED
        value: "false"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: NPM_CONFIG_INCLUDE
        value: "dev"
